name: Generate Profile Assets

on:
  schedule:
    - cron: "35 18 * * *"  # Run daily after day end (00:05 IST / 18:35 UTC)
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - 'dist/**'

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy
          
      - name: Generate GitHub Analytics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_github_analytics.py
          
      - name: Commit and push analytics image
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          COMMIT_NAME: ${{ secrets.COMMIT_NAME || 'github-actions[bot]' }}
          COMMIT_EMAIL: ${{ secrets.COMMIT_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}
        run: |
          git config --global user.name "${COMMIT_NAME}"
          git config --global user.email "${COMMIT_EMAIL}"
          if [ -n "${PERSONAL_TOKEN}" ]; then
            git remote set-url origin https://x-access-token:${PERSONAL_TOKEN}@github.com/${{ github.repository }}.git
          fi
          git add assets/github_analytics.png
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: update github analytics dashboard [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
          
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ArPaN-DS
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN || secrets.GITHUB_TOKEN }}
          
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN || secrets.GITHUB_TOKEN }}
